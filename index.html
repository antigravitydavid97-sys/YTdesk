<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F5F7" id="meta-theme-color" />
    <title>ContentFlow — Gestor de Contenido Multicanal</title>
    <meta name="description" content="Plataforma de organización editorial y flujo de producción para creadores en YouTube, TikTok e Instagram." />
    <meta property="og:title" content="ContentFlow — Gestor de Contenido Multicanal" />
    <meta property="og:description" content="Plataforma de organización editorial y flujo de producción para creadores en YouTube, TikTok e Instagram." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('contentflow_theme_v1');
          var pref = stored ? JSON.parse(stored) : 'auto';
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = pref === 'dark' || (pref === 'auto' && systemDark);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
          }
          var meta = document.getElementById('meta-theme-color');
          if (meta) {
            meta.setAttribute('content', isDark ? '#000000' : '#F5F5F7');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[var(--bg)] text-[var(--label)] antialiased selection:bg-[var(--accent)]/20 selection:text-[var(--accent)]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
